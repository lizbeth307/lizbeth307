name: SR-RX image

# Golden A/B UFS image recipe of sat-receiver-audit/deployment/image on a native ARM64 runner.
# recipe: host tests, unit verification, the GPT/mkfs layout round trip and the recovery-kit
#   write into a 4K loop device over a regular file (never a real disk).
# image: the locked Radxa OS r2 _4096 image + the controller bundle -> image file, manifest,
#   extent map and (optionally) a QEMU boot smoke. Only the manifest, facts, logs and map are
#   uploaded; the image contains Radxa OS and Qualcomm material and is uploaded only from a
#   PRIVATE repository, as a sparse tar + zstd archive with 1-day retention
#   (build/15-rishennia-komplektu.md; that path has not run yet). None of this is hardware
#   evidence: bench gates W-01/W-02/W-03/W-08/W-09/W-10 stay OPEN.

on:
  # A push runs the recipe checks; the image build needs a dispatch (or "[image-build]" in the
  # head commit message, because a workflow that is not on the default branch cannot be dispatched).
  push:
    branches: ['wip/**', 'codex/**', 'ccr-*']
    # Everything the jobs consume: build_image.py stages the controller tree (deploy.py stage copies
    # software/, firmware/, design/ and deployment/ into /opt/srrx, with deployment/system and the *.template.json
    # files), runs selftest.py, reads the lock and the policy, and installs deployment/repo's lab.pref and
    # apt sources byte for byte.
    paths:
      - 'sat-receiver-audit/deployment/image/**'
      - 'sat-receiver-audit/deployment/repo/**'
      - 'sat-receiver-audit/deployment/deploy.py'
      - 'sat-receiver-audit/deployment/*.template.json'
      - 'sat-receiver-audit/deployment/tests/test_image.py'
      - 'sat-receiver-audit/deployment/system/**'
      - 'sat-receiver-audit/deployment/sources.lock.json'
      - 'sat-receiver-audit/deployment/selftest.py'
      - 'sat-receiver-audit/deployment/receive-only-policy.json'
      - 'sat-receiver-audit/software/**'
      - 'sat-receiver-audit/firmware/**'
      - 'sat-receiver-audit/design/**'
      - '.github/workflows/sr-rx-image.yml'
  workflow_dispatch:
    inputs:
      build_image:
        description: 'Build the golden image from the locked r2 image (about 30-60 min per route)'
        type: boolean
        default: true
      routes:
        description: 'Routes to build: A, B or A B'
        type: string
        default: 'A B'
      smoke:
        description: 'Boot the Route A image under QEMU (UEFI, TCG unless /dev/kvm exists)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sr-rx-image-${{ github.ref }}
  cancel-in-progress: true

# shell: bash makes GitHub run every step as `bash --noprofile --norc -eo pipefail {0}`: a builder or
# recovery-kit command piped into tee or zstd fails the step with its own exit status (canary below).
defaults:
  run:
    shell: bash
    working-directory: sat-receiver-audit

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  recipe:
    name: Image recipe checks (aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: pipefail canary (a failing command before tee must fail a step)
        run: |
          if (false | tee /dev/null); then echo "::error::pipefail is not in effect"; exit 1; fi
          echo "pipefail in effect"
      - name: Builder tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends dosfstools e2fsprogs util-linux fdisk rsync xz-utils device-tree-compiler dmsetup
      - name: Runner resources (disk, KVM, sectors)
        run: |
          uname -a; nproc; free -h; df -h; lsblk -o NAME,SIZE,LOG-SEC,PHY-SEC,TYPE,MOUNTPOINTS || true
          ls -l /dev/kvm 2>&1 || true
          sfdisk --version; mkfs.vfat --help 2>&1 | head -2; losetup --version
          sfdisk --list-types --label gpt | grep -iE 'C12A7328-F81F-11D2-BA4B-00A0C93EC93B|0FC63DAF-8483-4772-8E79-3D69D8477DE4'
      - name: Host tests of the image recipe
        run: python3 -m unittest -v deployment.tests.test_image deployment.tests.test_deployment.DeploymentTests.test_ab_candidates_only_and_no_duplicate_roots
      - name: systemd-analyze verify of the boot-chain units
        run: |
          S="$RUNNER_TEMP/stage"
          python3 deployment/deploy.py stage --dest "$S" > /dev/null
          U="$RUNNER_TEMP/units"
          mkdir -p "$U"
          cp "$S"/rootfs/etc/systemd/system/srrx-radio-off.service deployment/image/files/*.service "$U"/
          SYSTEMD_UNIT_PATH="$U:" systemd-analyze verify --man=no "$U"/srrx-boot-check.service "$U"/srrx-ab-commit.service "$U"/srrx-radio-off.service \
            "$U"/srrx-ssh-hostkeys.service
      - name: Layout round trip (GPT on 4096-byte sectors, mkfs, mount, fsck) on a loop file
        run: |
          W="$RUNNER_TEMP/rt"
          mkdir -p "$W"
          sudo python3 deployment/image/build_image.py blank --work "$W" --output "$W/blank.img" --test-sizes | tee "$RUNNER_TEMP/blank.json"
          grep -q '"status": "BLANK_IMAGE_OK"' "$RUNNER_TEMP/blank.json"
      - name: Recovery kit write into a 4K loop target pre-filled with 0xFF, read back, grow /data
        run: |
          W="$RUNNER_TEMP/rt"
          sudo chown -R "$(id -u)" "$W"
          # The ext4 journals are holes of the image file (mke2fs zeroes them with fallocate): the map forces them.
          # Measured before the map reads them: ext4 reports unwritten extents as data once their pages are cached.
          python3 - "$W/blank.img" "$W/blank.img.forced.json" > "$RUNNER_TEMP/journal-holes.json" <<'EOF'
          import json, sys
          sys.path.insert(0, "deployment/image")
          import recovery_kit
          forced = json.load(open(sys.argv[2]))
          holes = sum(n for _, n in recovery_kit.uncovered(recovery_kit.data_extents(sys.argv[1])[1], forced))
          print(json.dumps({"journal_bytes": sum(f["length"] for f in forced), "journal_bytes_in_file_holes": holes}))
          EOF
          python3 deployment/image/recovery_kit.py map --image "$W/blank.img" --forced "$W/blank.img.forced.json" --output "$W/blank.img.map.json" | tee "$RUNNER_TEMP/map.json"
          python3 - "$W/blank.img.map.json" "$RUNNER_TEMP/journal-holes.json" > "$RUNNER_TEMP/journal-map.json" <<'EOF'
          import json, sys
          sys.path.insert(0, "deployment/image")
          import recovery_kit
          m, before = json.load(open(sys.argv[1])), json.load(open(sys.argv[2]))
          roles = sorted({f["what"].split()[0] for f in m["forced"]})
          assert roles == ["data", "root_a", "root_b"], roles
          assert not recovery_kit.uncovered(m["extents"], m["forced"]), "journal blocks outside the map extents"
          print(json.dumps(dict(before, map_data_bytes=m["data_bytes"], journal_covered=True)))
          EOF
          cat "$RUNNER_TEMP/journal-map.json"
          python3 deployment/image/recovery_kit.py assemble --image "$W/blank.img" --map "$W/blank.img.map.json" --out "$W/kit" --link
          python3 deployment/image/recovery_kit.py verify --kit "$W/kit" | tee "$RUNNER_TEMP/kit-verify.json"
          grep -q '"status": "KIT_VERIFIED"' "$RUNNER_TEMP/kit-verify.json"
          size=$(stat -c %s "$W/blank.img")
          # A used UFS, not zeros: every byte the write leaves alone stays 0xFF.
          head -c $((size + 512*1024*1024)) /dev/zero | tr '\000' '\377' > "$W/target.raw"
          T=$(sudo losetup --find --show --sector-size 4096 "$W/target.raw")
          # Refusals before the write: a plain /dev/loopN without the CI flag, a 512-byte target, the runner's root disk
          # (that one is refused by its 512-byte LOG-SEC already; the mounted/held/image checks run on the 4K target below).
          if sudo python3 deployment/image/recovery_kit.py write --kit "$W/kit" --target "$T" --execute 2>"$RUNNER_TEMP/plain-loop.err"; then echo "::error::loop target accepted without --test-loop-target"; exit 1; fi
          grep -q "by-id/<name> link" "$RUNNER_TEMP/plain-loop.err"
          truncate -s $((size + 512*1024*1024)) "$W/target512.raw"
          T512=$(sudo losetup --find --show "$W/target512.raw")
          if sudo python3 deployment/image/recovery_kit.py write --kit "$W/kit" --target "$T512" --test-loop-target --execute 2>"$RUNNER_TEMP/t512.err"; then echo "::error::512-byte target accepted"; exit 1; fi
          grep -q "LOG-SEC" "$RUNNER_TEMP/t512.err"
          sudo losetup -d "$T512"
          rootdisk=$(lsblk -no PKNAME "$(findmnt -no SOURCE /)" | head -1)
          link=$(for l in /dev/disk/by-id/*; do [ "$(readlink -f "$l")" = "/dev/$rootdisk" ] && echo "$l" && break; done)
          if [ -n "$link" ]; then
            if sudo python3 deployment/image/recovery_kit.py write --kit "$W/kit" --target "$link" 2>"$RUNNER_TEMP/root.err"; then echo "::error::root disk accepted"; exit 1; fi
            cat "$RUNNER_TEMP/root.err"
          else
            echo "no /dev/disk/by-id link for the root disk $rootdisk on this runner" | tee "$RUNNER_TEMP/root.err"
          fi
          sudo python3 deployment/image/recovery_kit.py write --kit "$W/kit" --target "$T" --test-loop-target | tee "$RUNNER_TEMP/dry.json"
          grep -q '"status": "DRY_RUN_ONLY"' "$RUNNER_TEMP/dry.json"
          sudo python3 deployment/image/recovery_kit.py write --kit "$W/kit" --target "$T" --test-loop-target --execute | tee "$RUNNER_TEMP/write.json"
          python3 - "$RUNNER_TEMP/write.json" "$RUNNER_TEMP/blank.json" <<'EOF'
          import json, sys
          r, blank = json.load(open(sys.argv[1])), json.load(open(sys.argv[2]))
          assert r["status"] == "WRITTEN_AND_READ_BACK" and not any(r["checks"].values()), r
          before = blank["geometry"]["partitions"]["data"]["size"]
          after = r["partition_table"]["partitions"][3]["size"]
          assert after > before, (before, after)
          assert [p["uuid"].lower() for p in r["partition_table"]["partitions"]] == [blank["identifiers"]["partuuid"][k] for k in ("esp", "root_a", "root_b", "data")]
          print("data partition grown", before, "->", after, "sectors; PARTUUIDs kept; e2fsck/fsck.vfat clean on the 0xFF-filled target")
          EOF
          # No journal block of the target kept the fill pattern.
          sudo python3 - "$T" "$W/blank.img.map.json" > "$RUNNER_TEMP/journal-target.json" <<'EOF'
          import json, os, sys
          fd, m = os.open(sys.argv[1], os.O_RDONLY), json.load(open(sys.argv[2]))
          fill, stale, blocks = b"\xff" * 4096, 0, 0
          for f in m["forced"]:
              for pos in range(f["offset"], f["offset"] + f["length"], 4096):
                  blocks += 1
                  stale += os.pread(fd, 4096, pos) == fill
          print(json.dumps({"journal_blocks": blocks, "blocks_with_the_fill_pattern": stale}))
          assert blocks and not stale, (blocks, stale)
          EOF
          cat "$RUNNER_TEMP/journal-target.json"
          sudo mkdir -p /mnt/srrx-data && sudo mount "${T}p4" /mnt/srrx-data && test -f /mnt/srrx-data/srrx-roundtrip
          # Refusals of a busy target: the image file on the target, a mounted partition, a held partition.
          sudo cp --sparse=always "$W/kit/golden/blank.img" /mnt/srrx-data/on-target.img
          sudo cp "$W/kit/golden/blank.img.map.json" /mnt/srrx-data/on-target.img.map.json
          if sudo python3 deployment/image/recovery_kit.py write --image /mnt/srrx-data/on-target.img --map /mnt/srrx-data/on-target.img.map.json \
               --target "$T" --test-loop-target --execute 2>"$RUNNER_TEMP/image-on-target.err"; then echo "::error::image on the target accepted"; exit 1; fi
          grep -q "image file lives on the target disk" "$RUNNER_TEMP/image-on-target.err"
          if sudo python3 deployment/image/recovery_kit.py write --kit "$W/kit" --target "$T" --test-loop-target --execute 2>"$RUNNER_TEMP/mounted.err"; then echo "::error::mounted target accepted"; exit 1; fi
          grep -q "holds mounted filesystems" "$RUNNER_TEMP/mounted.err"
          sudo rm /mnt/srrx-data/on-target.img /mnt/srrx-data/on-target.img.map.json
          sudo umount /mnt/srrx-data
          sudo dmsetup create srrx-hold-test --table "0 $(sudo blockdev --getsz "${T}p3") linear ${T}p3 0"
          if sudo python3 deployment/image/recovery_kit.py write --kit "$W/kit" --target "$T" --test-loop-target --execute 2>"$RUNNER_TEMP/held.err"; then echo "::error::held target accepted"; sudo dmsetup remove srrx-hold-test; exit 1; fi
          sudo dmsetup remove srrx-hold-test
          grep -q "held by dm-" "$RUNNER_TEMP/held.err"
          cat "$RUNNER_TEMP"/image-on-target.err "$RUNNER_TEMP"/mounted.err "$RUNNER_TEMP"/held.err
          sudo losetup -d "$T"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: image-recipe-checks
          retention-days: 7
          path: |
            ${{ runner.temp }}/*.json
            ${{ runner.temp }}/*.err

  image:
    name: Golden image (route ${{ matrix.route }})
    if: (github.event_name == 'workflow_dispatch' && inputs.build_image) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[image-build]'))
    needs: recipe
    strategy:
      fail-fast: false
      matrix:
        route: [A, B]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - name: Route selected
        id: sel
        working-directory: .
        env:
          ROUTES: ${{ inputs.routes || 'A B' }}
        run: |
          case " $ROUTES " in *" ${{ matrix.route }} "*) echo "run=true" >> "$GITHUB_OUTPUT";; *) echo "run=false" >> "$GITHUB_OUTPUT";; esac
      - uses: actions/checkout@v5
        if: steps.sel.outputs.run == 'true'
        with:
          persist-credentials: false
      - name: Builder tools
        if: steps.sel.outputs.run == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends dosfstools e2fsprogs util-linux fdisk rsync xz-utils device-tree-compiler \
            qemu-system-arm qemu-efi-aarch64 qemu-utils python3-numpy zstd
      - name: Work directory on the largest free filesystem
        if: steps.sel.outputs.run == 'true'
        run: |
          df -h
          best="$RUNNER_TEMP"; bestfree=$(df --output=avail -B1 "$RUNNER_TEMP" | tail -1)
          if [ -d /mnt ] && [ "$(df --output=avail -B1 /mnt | tail -1)" -gt "$bestfree" ]; then best=/mnt; fi
          sudo mkdir -p "$best/srrx-image"
          sudo chown "$(id -u)" "$best/srrx-image"
          echo "W=$best/srrx-image" >> "$GITHUB_ENV"
          echo "OUT=$best/srrx-image/out" >> "$GITHUB_ENV"
          echo "CACHE=$HOME/srrx-cache" >> "$GITHUB_ENV"
          python3 - >> "$GITHUB_ENV" <<'EOF'
          import hashlib, json
          arts = json.load(open("deployment/sources.lock.json"))["artifacts"]
          print("CACHE_KEY=srrx-locked-" + hashlib.sha256(json.dumps(sorted(a["sha256"] for a in arts)).encode()).hexdigest()[:16])
          # The package closure debs (W2 IMG-2) have their own key: a closure change never refetches the 1.6 GB base image.
          print("CLOSURE_KEY=srrx-closure-" + hashlib.sha256(open("deployment/image/package-closure.json", "rb").read()).hexdigest()[:16])
          EOF
      - uses: actions/cache@v4
        if: steps.sel.outputs.run == 'true'
        with:
          # Public upstream release files only (Radxa r2 image and kernel debs), never a derived image.
          path: ~/srrx-cache
          key: ${{ env.CACHE_KEY }}
      - uses: actions/cache@v4
        if: steps.sel.outputs.run == 'true'
        with:
          # Public Ubuntu snapshot debs of deployment/image/package-closure.json only.
          path: ~/srrx-cache/closure
          key: ${{ env.CLOSURE_KEY }}
      - name: Fetch and verify the locked base image, kernel debs and package closure debs
        if: steps.sel.outputs.run == 'true'
        run: python3 deployment/image/build_image.py fetch --cache "$CACHE"
      - name: Build the golden image (candidate)
        if: steps.sel.outputs.run == 'true'
        run: |
          mkdir -p "$OUT"
          sudo python3 deployment/image/build_image.py build --cache "$CACHE" --work "$W/work" --out "$OUT" \
            --route ${{ matrix.route }}
      - name: Summarize the manifest and facts
        if: always() && steps.sel.outputs.run == 'true'
        run: |
          sudo chown -R "$(id -u)" "$OUT" || true
          df -h "$W" || true
          python3 - "$OUT" <<'EOF'
          import json, sys
          from pathlib import Path
          out = Path(sys.argv[1])
          for name in ("image-manifest.json", "image-facts.json"):
              p = out / name
              if not p.is_file():
                  print(name, "missing"); continue
              d = json.loads(p.read_text())
              if name == "image-manifest.json":
                  print(json.dumps({k: d.get(k) for k in ("status", "error", "blocking", "blocking_by_closes_at", "kernel", "package_closure", "bootloader", "entries", "enabled_units", "accounts", "hardening", "apt_sources", "npu_payload", "mcu_firmware", "selftest_root_a", "filesystem_checks", "image")}, indent=1)[:24000])
              else:
                  r = d.get("root", {})
                  print(json.dumps({"partitions": d.get("partitions"), "base_cmdline_status": d.get("base_cmdline_status"),
                                    "kernel_cmdline": r.get("kernel_cmdline"), "rescue": d.get("rescue"), "esp_entries": d.get("esp", {}).get("entries"),
                                    "loader_conf": d.get("esp", {}).get("loader_conf"), "kernel_install_plugins": r.get("kernel_install_plugins"),
                                    "packages_of_interest": r.get("packages_of_interest"), "diversions": r.get("diversions"), "units": r.get("units"),
                                    "accounts": r.get("accounts"), "machine_id": r.get("machine_id"), "kernel_deb_config": d.get("kernel_deb_config"),
                                    "kernel_debs": d.get("kernel_debs"), "fstab": r.get("fstab"), "used_bytes": r.get("used_bytes"),
                                    "dpkg_holds": r.get("dpkg_holds"), "netplan": r.get("netplan")}, indent=1)[:30000])
          EOF
      - name: QEMU boot smoke of the Route A image
        if: steps.sel.outputs.run == 'true' && matrix.route == 'A' && (inputs.smoke || contains(github.event.head_commit.message, '[image-smoke]'))
        run: |
          # --require-model: QEMU, AAVMF or a kernel config that cannot run the model is a failure, not a green step.
          sudo python3 deployment/image/smoke_qemu.py --image "$OUT/srrx-golden-routeA.img" --manifest "$OUT/image-manifest.json" \
            --work "$W/smoke" --out "$OUT/smoke" --require-model
          python3 -c "import json, sys; s = json.load(open(sys.argv[1]))['status']; print(s); sys.exit(s != 'MODEL_PASS')" "$OUT/smoke/smoke-report.json"
      - name: Pack the image data (sparse tar + zstd) and measure it
        if: steps.sel.outputs.run == 'true'
        run: |
          # Only the data: GNU tar --sparse stores the holes as a map, so the archive holds the extent
          # data (about 13 GB per route), never the 52.6 GB apparent size.
          I="srrx-golden-route${{ matrix.route }}"
          sudo chown -R "$(id -u)" "$OUT"
          tar -C "$OUT" --sparse -cf - "$I.img" "$I.img.map.json" image-manifest.json image-facts.json | zstd -T0 -6 -q -o "$W/$I.tar.zst"
          zstd -dc "$W/$I.tar.zst" | tar -tvf - > "$OUT/packed-listing.txt"
          python3 - "$W/$I.tar.zst" "$OUT/$I.img.map.json" "$OUT/packed-listing.txt" > "$OUT/packed-image.json" <<'EOF'
          import hashlib, json, os, sys
          with open(sys.argv[1], "rb") as handle:
              digest = hashlib.file_digest(handle, "sha256").hexdigest()
          m = json.load(open(sys.argv[2]))
          print(json.dumps({"archive": os.path.basename(sys.argv[1]), "archive_bytes": os.path.getsize(sys.argv[1]), "sha256": digest,
                            "image_bytes": m["image_bytes"], "map_data_bytes": m["data_bytes"],
                            "members": len(open(sys.argv[3]).read().splitlines()), "uploaded": False}, indent=1))
          EOF
          cat "$OUT/packed-image.json" "$OUT/packed-listing.txt"
          echo "PACKED=$W/$I.tar.zst" >> "$GITHUB_ENV"
      - name: Resolve the package closure from the gpgv-verified snapshot (CI helper; the build never resolves)
        if: always() && steps.sel.outputs.run == 'true' && matrix.route == 'A'
        run: |
          # The r2 dpkg status of this run's facts against the signed snapshot indices. The step fails when the result
          # differs from the committed deployment/image/package-closure.json: package-closure.resolved.json of the
          # artifact is then applied as a GENERATED commit.
          sudo chown -R "$(id -u)" "$OUT" || true
          test -f "$OUT/image-facts.json" || { echo "::error::no image-facts.json to resolve against"; exit 1; }
          rc=0
          python3 deployment/image/build_image.py closure --resolve --facts "$OUT/image-facts.json" \
            --keyring /usr/share/keyrings/ubuntu-archive-keyring.gpg --work "$W/closure-resolve" \
            --write "$OUT/package-closure.resolved.json" > "$OUT/closure-resolve.json" || rc=$?
          python3 -c "import json, sys; r = json.load(open(sys.argv[1])); print(json.dumps({k: r.get(k) for k in ('status', 'differs', 'issues', 'dpkg_holds')}, indent=1))" "$OUT/closure-resolve.json" || true
          exit $rc
      - name: Upload the manifest, facts, logs and extent map
        if: always() && steps.sel.outputs.run == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: image-route-${{ matrix.route }}-manifest
          retention-days: 7
          path: |
            ${{ env.OUT }}/*.json
            ${{ env.OUT }}/packed-listing.txt
            ${{ env.OUT }}/build.log
            ${{ env.OUT }}/smoke
      # UNVERIFIED until it runs once in a private copy of this repository (import or mirror push; a fork of a
      # public repository cannot be private): this repository is public, so the step is skipped
      # here. The upload is the packed archive (sparse tar + zstd), never the sparse image itself, which
      # upload-artifact would read as its full apparent size. Size: packed-image.json of each run.
      - name: Upload the packed image (private repository only, 1 day)
        if: success() && steps.sel.outputs.run == 'true' && github.event.repository.private
        uses: actions/upload-artifact@v5
        with:
          name: image-route-${{ matrix.route }}-PRIVATE
          retention-days: 1
          compression-level: 0
          path: ${{ env.PACKED }}
