name: SR-RX verification

# Host regression and CAD/netlist checks for sat-receiver-audit on real Linux
# (x86_64 and ARM64). The ARM64 QEMU lab is long and runs only on request.
# None of these jobs produce hardware evidence: physical gates stay OPEN.

on:
  push:
    branches: ['codex/**', 'ccr-*']
    paths: ['sat-receiver-audit/**', '.github/workflows/sr-rx-verify.yml']
  pull_request:
    paths: ['sat-receiver-audit/**', '.github/workflows/sr-rx-verify.yml']
  workflow_dispatch:
    inputs:
      linux_lab:
        description: 'Also run the full ARM64 QEMU Linux lab, finalize and repackage (about 1 h)'
        type: boolean
        default: false
      archive_as:
        description: 'Directory name under verification/linux-attempts for the previously imported run'
        type: string
        default: 'run07'

permissions:
  contents: read

concurrency:
  group: sr-rx-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sat-receiver-audit

env:
  PYTHONDONTWRITEBYTECODE: '1'
  QT_QPA_PLATFORM: offscreen
  # Same versions as deployment/linux_lab/wheelhouse-requirements.txt (the
  # ARM64 guest lock); hashes there are aarch64-only, so they are not reused.
  PY_PINS: >-
    numpy==2.3.5 onnx==1.23.2 onnxruntime==1.31.0 PySide6==6.12.0
    lxml PyMuPDF

jobs:
  host:
    name: Host regression (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt runtime libraries and compilers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 libglib2.0-0t64 gcc g++
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check $PY_PINS
      - name: Host regression (Internet sockets denied)
        run: python tools/run_tests_offline.py
      - name: Summarize regression report
        if: always()
        run: |
          python - <<'EOF'
          import json
          r = json.load(open("verification/software-tests.json"))
          print(r["host_regression_status"], r["tests_discovered"], "discovered,", r["passed"], "passed")
          print("groups:", r["test_groups"])
          for kind in ("failures", "errors"):
              for item in r[kind]:
                  print("::error title=" + kind + "::" + item["test"])
          for item in r["skipped"]:
              print("SKIP", item["test"], "--", item["reason"])
          EOF
          cp verification/software-tests.json "$RUNNER_TEMP/software-tests-${{ matrix.arch }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: software-tests-${{ matrix.arch }}
          path: ${{ runner.temp }}/software-tests-${{ matrix.arch }}.json
      - name: Independent CAD, netlist and electrical checks
        if: matrix.arch == 'x86_64'
        run: |
          git checkout -- verification/software-tests.json
          python tools/validate_project.py
          python verification/independent_netlist_check.py
          python verification/independent_pcb_check.py
          python verification/pcb-prototype-review-check.py
          python tools/check_electrical_invariants.py
          python pcb/prepare.py --check
      - name: Checks reproduce the committed reports
        if: matrix.arch == 'x86_64'
        run: git diff --exit-code -- .

  module-lab:
    name: Module lab (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt runtime libraries and compilers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 libglib2.0-0t64 gcc g++
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check $PY_PINS
      - name: Run module lab
        run: python deployment/module_lab/run.py --project . --output "$RUNNER_TEMP/module-run"
      - name: Summarize module lab
        if: always()
        run: |
          python - "$RUNNER_TEMP/module-run/report.json" <<'EOF'
          import json, sys
          r = json.load(open(sys.argv[1]))
          print({k: r[k] for k in r if isinstance(r[k], (str, int, float, bool))})
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module-lab-${{ matrix.arch }}
          path: ${{ runner.temp }}/module-run

  linux-lab:
    name: ARM64 QEMU Linux lab
    if: github.event_name == 'workflow_dispatch' && inputs.linux_lab
    needs: host
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host utilities (no QEMU from apt; the lab uses its locked tools)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            gpgv ubuntu-keyring ubuntu-cloudimage-keyring e2fsprogs curl \
            libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 libglib2.0-0t64 gcc g++
          python -m pip install --disable-pip-version-check $PY_PINS
      - name: Fetch locked QEMU tools and guest assets
        run: |
          python deployment/linux_lab/fetch_tools.py --dest "$RUNNER_TEMP/qemu-tools"
          python deployment/linux_lab/fetch_assets.py --dest "$RUNNER_TEMP/arm64-assets"
      - name: Prepare guest
        run: |
          T="$RUNNER_TEMP/qemu-tools/bin"
          python deployment/linux_lab/host.py prepare \
            --assets "$RUNNER_TEMP/arm64-assets" --work "$RUNNER_TEMP/lab-run" \
            --qemu "$T/qemu-system-aarch64" --qemu-img "$T/qemu-img" --genisoimage "$T/genisoimage"
      - name: Run guest
        run: python deployment/linux_lab/host.py run --work "$RUNNER_TEMP/lab-run" --timeout 7200
      - name: Finalize, rebuild documents/firmware and repackage
        run: |
          python tools/run_tests_offline.py
          # The previous imported run moves to the attempt archive unchanged.
          prev="verification/linux-attempts/${{ github.event.inputs.archive_as || 'previous' }}"
          test ! -e "$prev"
          git mv verification/linux-lab "$prev"
          git mv verification/module-lab "$prev/module-lab"
          python tools/finalize_linux_lab.py --work "$RUNNER_TEMP/lab-run"
          python tools/build_documents.py
          python tools/build_firmware.py
          python tools/build_bundle.py
          python -B tools/check_bundle.py
          git add -A .
          git -c core.quotePath=false diff --cached --binary > "$RUNNER_TEMP/lab-evidence.patch"
          git diff --cached --stat | tail -5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-lab-run
          path: |
            ${{ runner.temp }}/lab-evidence.patch
            ${{ runner.temp }}/lab-run/report.json
            ${{ runner.temp }}/lab-run/run.json
            ${{ runner.temp }}/lab-run/console.log
            ${{ runner.temp }}/lab-run/results
