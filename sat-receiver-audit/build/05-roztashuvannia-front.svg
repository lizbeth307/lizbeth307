<text x="830.0" y="276.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">бобишка: O-ring + стінка 2.4-3 + шайба 0.5 + гайка 2.0 ≤6.5 на різьбі 7;</text>
<text x="830.0" y="294.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">≥0.5 різьби; вал T ≤ 10 − d; спідниця ручки ≥0.5 над гайкою</text>
<line x1="776.0" y1="386.0" x2="822.0" y2="318.0" stroke="#555" stroke-width="0.7"/>
<text x="830.0" y="322.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Енкодер гучності з натисканням (ручка Adafruit 2055): Ø — TBD</text>
<text x="830.0" y="340.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">(STACK.md §2.6 не дає розміру ручки)</text>
