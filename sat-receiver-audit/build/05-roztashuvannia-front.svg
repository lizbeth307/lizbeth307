<text x="908.0" y="680.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">козирок закривати</text>
<text x="908.0" y="696.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">як кришку при</text>
<text x="908.0" y="712.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">зберіганні (80 °C)</text>
<text x="20.0" y="700.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Примітки</text>
<text x="20.0" y="720.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">1. Габарит: 220-225 x 135-140 x 55-60 мм (+ ≈5 мм на складений козирок); ASA White PF01002 (STACK.md §5.8, §2.9).</text>
<text x="20.0" y="738.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">2. Вікно LED стану (матове вікно або світловод) і акустичний ePTFE-клапан п'єзо — місце і SKU TBD (STACK.md §2.9).</text>
<text x="20.0" y="756.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">3. У дощ — LOCK (сенсор вимкнено) і робота лише енкодерами (STACK.md §5.8).</text>
<text x="20.0" y="774.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">4. Крок кнопок 22-25 мм — лише якщо лице 135-140 мм вміщує ручку 35, енкодер гучності і 62 мм кнопок.</text>
<text x="20.0" y="792.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">5. Позиції скла і колонки на кресленні — схема для перевірки вмісту; остаточно — CAD з Radxa STEP V1.21.</text>
