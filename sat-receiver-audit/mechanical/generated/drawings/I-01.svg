<text x="141" y="200" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.8" text-anchor="start" fill="#000">mechanical/build.py · params 1302eaa613bb · v1.0.0</text>
<text x="12" y="15" font-family="DejaVu Sans, Arial, sans-serif" font-size="5.6" text-anchor="start" fill="#000">Пак IMU: Hammond 1550Z101 — свердління, плати, осі</text>
<text x="12" y="20.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.64" text-anchor="start" fill="#000">2:1</text>
<text x="12" y="25" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.22" text-anchor="start" fill="#000">Осі паку: +X — стрілка на кришці (бортове візування антени), +Z — з кришки, +Y = Z x X (правий трійник).</text>
<text x="12" y="28.6" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.22" text-anchor="start" fill="#000">BNO085 ставиться так, щоб осі мікросхеми збігалися з осями паку (матриця chip_to_pack = I); знаки й орієнтацію перевіряє стенд (OPEN).</text>
<text x="12" y="32.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.22" text-anchor="start" fill="#000">Дно: отвір ⌀6.6 під 1/4-20; носій (STL) з латунною вставкою 1/4-20 x 12.7, гвинти M3 у вставки; плати на стійках 13 мм над носієм.</text>
<text x="12" y="35.8" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.22" text-anchor="start" fill="#000">Носійна плата IMU_CARRIER (U552, D502, C519, C520, деталі E3 External IMU) — смуга вздовж стінки y_min під платами, на тих самих гвинтах M3 (резерв, розкладка — хвиля 2).</text>
<text x="12" y="39.4" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.22" text-anchor="start" fill="#000">Стінка y_max: SKINTOP MS-SC-M12 ⌀12.2; шов кришки — провідна фольгова стрічка; момент гвинтів кришки 50-75 cN·m (креслення Hammond).</text>
<text x="12" y="43" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.22" text-anchor="start" fill="#000">Матеріал: литий Al (Hammond 1550Z101), латунні гвинти кришки M4</text>
</svg>
