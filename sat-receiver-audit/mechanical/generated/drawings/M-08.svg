<text x="12" y="25" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.22" text-anchor="start" fill="#000">Полиця 'стінка' прилягає до стінки корпусу зсередини; отвори збігаються з отворами корпусу (M-02, M-03).</text>
<text x="12" y="28.6" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.22" text-anchor="start" fill="#000">Полиця 'пластина' кріпиться до тильного боку пластини (M-07): гвинти M3 з тильного боку у врівень-гайки PEM F-M3-1 пластини; з'єднання — голий метал.</text>
<text x="12" y="32.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.22" text-anchor="start" fill="#000">Гвинти верхнього кутника — посередині між портами, щоб їхні голівки минали корпуси прохідників SMA і гайку F (fit-report nut.*).</text>
<text x="12" y="35.8" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.22" text-anchor="start" fill="#000">SMA CAB.718, Adam Tech, CAB.01075 і CAB.011 — гайка й шайба з лицьового боку (зовні), корпус 8 HEX — на кутнику зсередини; кілець у їхніх кресленнях немає — ущільнення вирізу T-07. Лиска CAB.718 (⌀6.5 / 6) — у вирізі стінки ASA (M-02), отвір кутника — круглий ⌀6.5. F VFA340 — фланець зовні, шайба й гайка на кутнику.</text>
<text x="12" y="39.4" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.22" text-anchor="start" fill="#000">Прохідники: ≥3 повні витки різьби для стикування після стінки, шайби й гайки (R-SMA-THREAD, STACK 5.8).</text>
<text x="12" y="43" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.22" text-anchor="start" fill="#000">Матеріал: EN AW-6060 L angle 15 x 12 x 2 (cut from 20 x 20 x 2 or 2.0 mm 5754 bent), screwed to the plate (STACK 5.8 'стінка 4-5: ASA + 2 мм Al')</text>
</svg>
