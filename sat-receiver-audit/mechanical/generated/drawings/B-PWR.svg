<text x="12" y="15" font-family="DejaVu Sans, Arial, sans-serif" font-size="5.6" text-anchor="start" fill="#000">Плата PWR: контур Edge.Cuts і кріпильні отвори</text>
<text x="12" y="20.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.64" text-anchor="start" fill="#000">power board PWR-A, plate-bonded (PWR_MAIN + PWR_BRANCH + USB_POWER)</text>
<text x="12" y="25" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.22" text-anchor="start" fill="#000">Координати — від лівого нижнього кута контуру, вид з боку компонентів (деталі лише зверху, build/15).</text>
<text x="12" y="28.6" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.22" text-anchor="start" fill="#000">Отвори ⌀3.2, зона заборони міді/деталей ⌀7; висота деталей ≤4.5 мм.</text>
<text x="12" y="32.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.22" text-anchor="start" fill="#000">Кріплення: plate front face; Gelid 0.5 mm pads under the thermal_bond zones, gap 0.4 mm set by shim washers (mechanical.json pwr_bond); гвинт the M3 male stud of the PWR-A/PWR-B standoff (F45, M3 male-female, body 5.0 = the B2B stack) from the component side (board 1.6 + shim 0.4 + plate 2.0: the stud is at most 4.0 long so its tip ends flush with the plate rear face, as the earlier M3 x 4 did; generated/fastener-stacks.json PWR_A-PLATE).</text>
<text x="12" y="35.8" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.22" text-anchor="start" fill="#000">boards/&lt;id&gt;-edge-cuts.dxf — лише контур (CUT) і отвори (HOLE) для KiCad Edge.Cuts; 1 одиниця = 1 мм.</text>
<text x="12" y="39.4" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.22" text-anchor="start" fill="#000">Пунктир: зони термопрокладок, модулі на платі, перемикачі/енкодер; рамки по краях — зони роз'ємів (contract/boards.json).</text>
</svg>
