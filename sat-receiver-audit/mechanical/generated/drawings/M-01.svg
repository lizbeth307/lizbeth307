<text x="12" y="28.6" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.22" text-anchor="start" fill="#000">Лінія роз'єму корпусу показана штриховою (BEND); отвори ⌀3 'TBD' — лише кернування, остаточний виріз за кресленням обраної деталі.</text>
<text x="12" y="32.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.22" text-anchor="start" fill="#000">Пунктир уздовж роз'єму — краї пояса шва (1.9 мм назовні від грані, по 5 мм на кожній оболонці, M-13); отвори в поясі не розміщувати.</text>
<text x="12" y="35.8" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.22" text-anchor="start" fill="#000">MODEL FIT ONLY: посадку кожної деталі перевірити на стенді (ворота OPEN).</text>
</svg>
