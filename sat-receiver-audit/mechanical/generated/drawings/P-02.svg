<text x="12" y="25" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.22" text-anchor="start" fill="#000">SMA-прохідники RF_IN/RF_OUT: виріз ⌀6.47 з лискою 5.94 за кресленням прохідника гніздо-гніздо Fairview SM4955 (панель ≤6.35); RF_IN, RF_OUT і PWR — у торцевих стінках, товщину яких креслення Hammond 1554U не розмірює (≤3.94 за різницею довжин; переріз B-B дає 3 лише бічним стінкам); кільця в даташиті SM4955 немає — ущільнення й закупівельна позиція AI-SMA-BULK-POD — TBD (SRC-2).</text>
