<text x="12" y="15" font-family="DejaVu Sans, Arial, sans-serif" font-size="5.6" text-anchor="start" fill="#000">Шов корпусу і лючок: пояс, паз ущільнення, гвинти</text>
<text x="12" y="20.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.64" text-anchor="start" fill="#000">переріз 5:1 (x — углиб від зовнішньої грані, z — від площини роз'єму)</text>
<text x="12" y="25" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.22" text-anchor="start" fill="#000">Паз 2.6 x 1.55 мм у лицьовій оболонці; шнур ⌀2: стиск 22 %, заповнення 78 %</text>
<text x="12" y="28.6" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.22" text-anchor="start" fill="#000">(статичне ущільнення: стиск 15-30 %, заповнення ≤85 % — parts.json oring_groove_rule). Пояс — стінка, потовщена назовні, тож паз не заходить усередину.</text>
<text x="12" y="32.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.22" text-anchor="start" fill="#000">Пояс 1.9 мм назовні, висота 5 мм на кожній оболонці; стінки біля паза 0.9 мм (2 периметри по 0.45).</text>
<text x="12" y="35.8" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.22" text-anchor="start" fill="#000">Гвинти шва: 14 x M3 ISO 14580 A2 TX10 у вставки M3x5.7; бобишки при стінці (вісь 4.5 мм від зовнішньої грані), отвір усередині від паза.</text>
<text x="12" y="39.4" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.22" text-anchor="start" fill="#000">Найдовший проліт між гвинтами 121 мм — лівий нижній кут (батарея й екран HF+ біля стінок); IPX4 — ворота T-07 OPEN.</text>
<text x="12" y="43" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.22" text-anchor="start" fill="#000">Шнур укласти без натягу, стик — посередині нижнього краю, торці склеїти; лючок: той самий паз у кришці, шнур близько 160 мм.</text>
<text x="12" y="46.6" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.22" text-anchor="start" fill="#000">Під головку кожного гвинта — ущільнювальна шайба (MPN TBD): гвинти проходять крізь задню стінку всередині шва.</text>
