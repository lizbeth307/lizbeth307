[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "srrx-control"
version = "0.3.1"
description = "SR-RX supervisor link and interlocked local control service"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
radio = ["numpy>=1.26,<3"]
hmi = ["numpy>=1.26,<3", "PySide6>=6.8,<7"]
model = ["numpy>=1.26,<3", "onnx>=1.17,<2", "onnxruntime>=1.20,<2"]
orbits = ["numpy>=1.26,<3", "skyfield>=1.55,<2", "sgp4>=2.27,<3"]

[project.scripts]
labd = "srrx.daemon:main"
labctl = "srrx.cli:main"
labrx = "srrx.labrx:main"
labmenu = "srrx.hmi:main"
labclassify = "srrx.learning:main"
labmodel = "srrx.model_export:main"
labdecode = "srrx.decoder_policy:main"

[tool.setuptools.packages.find]
include = ["srrx*"]
