# SR-RX v2.1: out-of-tree pps-gpio for the held 6.18.2-4-qcom kernel (build/07 §5.2, STACK.md:840).
# 6.18.2-4 has CONFIG_PPS=y and CONFIG_PPS_CLIENT_GPIO unset (components/compute_os.md:324).
# pps-gpio.c is radxa/kernel 559f4f9 drivers/pps/clients/pps-gpio.c, copied in only after
# deployment/system/pps_dkms.py verified its SHA-256 (deployment/system/system-sources.lock.json).
PACKAGE_NAME="srrx-pps-gpio"
PACKAGE_VERSION="1.2.0+lab1"
BUILT_MODULE_NAME[0]="pps-gpio"
DEST_MODULE_LOCATION[0]="/updates/dkms"
# The kernel was built with Debian gcc 12.2.0 and MODULE_SIG off (build/07 §5.2): gcc-12, never noble's gcc-13.
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build CC=gcc-12 modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
AUTOINSTALL="yes"
